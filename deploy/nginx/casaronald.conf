# Casa Ronald — Casita Digital (instalado por deploy/provision.sh en /etc/nginx/conf.d/)
#
# Cuando haya un dominio apuntando al servidor, sustituir el certificado
# autofirmado por uno de Let's Encrypt:
#   sudo certbot --nginx -d mi-dominio.org
# y descomentar la cabecera Strict-Transport-Security.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __APP_HOST__;

    location ^~ /.well-known/acme-challenge/ {   # validación de Let's Encrypt
        root /var/www/casaronald/public;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name __APP_HOST__;

    root /var/www/casaronald/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/nginx/ssl/casaronald.crt;
    ssl_certificate_key /etc/nginx/ssl/casaronald.key;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header Strict-Transport-Security "max-age=31536000" always;   # solo con certificado válido

    access_log /var/log/nginx/casaronald.access.log main;
    error_log  /var/log/nginx/casaronald.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Librerías vendorizadas (jQuery, Bootstrap, DataTables, Chart.js): cambian rara vez
    location ^~ /vendor/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Fotos de expediente: public/storage → storage/app/public
    location ^~ /storage/ {
        expires 7d;
        try_files $uri =404;
    }

    # CSS/JS/imágenes propios: caché corta, el navegador revalida por ETag
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 120s;
    }

    # Nunca servir archivos ocultos (.env, .git, .htaccess)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
