; Casa Ronald — ajustes de PHP para producción (instalado en /etc/php.d/ por deploy/provision.sh)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 20M
post_max_size = 25M
date.timezone = America/Mexico_City
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: el código compilado vive en memoria; se revalida como mucho cada 60 s
; y deploy/deploy.sh recarga PHP-FPM tras cada despliegue.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
