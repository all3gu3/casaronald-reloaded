<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sin foto">
  <!-- Avatar de reserva para niños sin foto: silueta amable con proporciones
       infantiles (cabeza grande, hombros cortos) sobre el amarillo cálido de
       la paleta de la casa. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7DF"/>
      <stop offset="1" stop-color="#FFE7A8"/>
    </linearGradient>
    <linearGradient id="figura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A6B9D"/>
      <stop offset="1" stop-color="#22345C"/>
    </linearGradient>
    <clipPath id="marco">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#marco)">
    <rect width="200" height="200" fill="url(#fondo)"/>
    <!-- Destellos suaves para que el fondo no se sienta plano -->
    <circle cx="162" cy="38" r="26" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="34" cy="58" r="16" fill="#FFFFFF" opacity="0.28"/>
    <!-- Cabeza y hombros -->
    <circle cx="100" cy="90" r="34" fill="url(#figura)"/>
    <path d="M100 134 C 71 134 48 156 45 186 L 45 202 L 155 202 L 155 186 C 152 156 129 134 100 134 Z" fill="url(#figura)"/>
  </g>
</svg>
